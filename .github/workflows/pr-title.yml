name: PR title

# The pull request title becomes the squash commit on main, the line on the release page and the
# input of the next version (scripts/release-version.mjs), so it must be a Conventional Commit.
# `edited` reruns the check when only the title changes.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: pr-title-${{ github.ref }}
  cancel-in-progress: true

jobs:
  title:
    name: PR title
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require a Conventional Commit title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='feat|fix|docs|refactor|test|chore|build|ci|perf|style|revert'
          if ! printf '%s' "$TITLE" | grep -Eq "^($types)(\([a-z0-9][a-z0-9._/-]*\))?!?: \.*[^.[:space:]](.*[^.[:space:]])?$"; then
            echo "::error::\"$TITLE\" is not a Conventional Commit. Use <type>(<optional scope>): <summary>, for example \"fix(cockpit): keep the drawer open\". Types: ${types//|/, }. feat releases a minor version, fix/perf a patch, ! a major; the others release nothing. No trailing period."
            exit 1
          fi
          echo "PR title ok: $TITLE"
