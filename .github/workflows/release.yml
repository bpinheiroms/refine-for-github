name: Release

# Every merge into main releases itself when it changes what users run (same model as
# BridgLabs/opencodereview, but automatic on merge instead of a button):
#   1. build: scripts/release-version.mjs picks the next version from the Conventional Commits
#      since the last tag (feat → minor, fix/perf/revert → patch, breaking → major). docs, ci,
#      chore, refactor, test… release nothing, and the run stops. Otherwise the manifest takes the
#      version and the Chrome and Firefox packages are built and linted. This job runs npm code
#      (web-ext) and never sees the deploy key.
#   2. publish: a `release: vX.Y.Z` commit moves main forward and is tagged vX.Y.Z, pushed with the
#      RELEASE_DEPLOY_KEY deploy key, which the ruleset lets bypass the pull request rule. Only git
#      and gh run while the key is on disk. If main moved meanwhile, the fast-forward push fails and
#      nothing is released (the next run picks it up). The GitHub release vX.Y.Z gets both zips and
#      the pull requests since the last tag.
# Re-running a failed run is safe: build computes the same version from the same commit, and
# publish finds the tag already pushed and goes on to (re)publish the release.
# Actions → Release → Run workflow forces a bump (e.g. to ship a docs-only change) or a dry run.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump; auto reads it from the commits
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry-run:
        description: Show the next version and build without committing, tagging or publishing
        type: boolean
        default: false

permissions:
  contents: read

# One release at a time: a second run waits instead of racing for the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Version and packages
    if: github.repository == 'bpinheiroms/refine-for-github' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Next version
        id: version
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
        run: |
          version=$(node scripts/release-version.mjs)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -z "$version" ]; then
            echo "Nothing to release: no feat, fix, perf or breaking commit since the last tag." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Next version: **v$version**." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set the version and build the packages
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/release-version.mjs set "$VERSION"
          ./scripts/package.sh
          npx --yes web-ext@10.8.0 lint --source-dir dist/firefox --warnings-as-errors

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.version.outputs.version != ''
        with:
          name: packages
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Tag and release
    needs: build
    if: needs.build.outputs.version != '' && !inputs.dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG: v${{ needs.build.outputs.version }}
    steps:
      # GitHub's own checkout: the deploy key is not handed to a third-party action, and no npm code
      # runs in this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist

      # Fast-forward only, main and the tag together (--atomic). A re-run finds the tag already
      # pushed, checks that main holds it, and goes on to publish.
      - name: Commit, tag and push to main
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG is already tagged."
            git fetch -q origin main
            if ! git merge-base --is-ancestor "$TAG" origin/main; then
              echo "::error::$TAG exists but main does not contain it. Fix main or delete the tag, then run the release again."
              exit 1
            fi
          else
            node scripts/release-version.mjs set "$VERSION"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add extension/manifest.json
            git commit -m "release: $TAG"
            git tag -a "$TAG" -m "Refine for GitHub $TAG"
            git push --atomic origin "HEAD:refs/heads/main" "$TAG"
          fi

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fields=(-f tag_name="$TAG")
          previous=$(git tag --merged "$TAG^" --sort=-v:refname | grep -Ex 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          [ -n "$previous" ] && fields+=(-f previous_tag_name="$previous")
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${fields[@]}" --jq .body > "$RUNNER_TEMP/notes.md"
          zips=("dist/refine-for-github-$VERSION-chrome.zip" "dist/refine-for-github-$VERSION-firefox.zip")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --latest
            gh release upload "$TAG" "${zips[@]}" --clobber
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag --latest "${zips[@]}"
          fi
