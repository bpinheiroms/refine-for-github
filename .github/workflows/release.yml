name: Release

# Every merge into main releases itself when it changes what users run (same model as
# BridgLabs/opencodereview, but automatic on merge instead of a button):
#   1. scripts/release-version.mjs picks the next version from the Conventional Commits since the
#      last tag (feat → minor, fix/perf/revert → patch, breaking → major). docs, ci, chore,
#      refactor, test… release nothing, and the run stops.
#   2. extension/manifest.json takes the version, the Chrome and Firefox packages are built and
#      the Firefox one is linted.
#   3. A `release: vX.Y.Z` commit moves main forward and is tagged vX.Y.Z, pushed with the
#      RELEASE_DEPLOY_KEY deploy key, which the ruleset lets bypass the pull request rule. If main
#      moved meanwhile, the fast-forward push fails and nothing is released (the next run picks it up).
#   4. The GitHub release vX.Y.Z gets both zips and the list of pull requests since the last tag.
# Actions → Release → Run workflow forces a bump (e.g. to ship a docs-only change) or a dry run.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump; auto reads it from the commits
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry-run:
        description: Show the next version and build without committing, tagging or publishing
        type: boolean
        default: false

permissions:
  contents: read

# One release at a time: a second run waits instead of racing for the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    if: github.repository == 'bpinheiroms/refine-for-github' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      DRY_RUN: ${{ inputs.dry-run || false }}
    steps:
      # The deploy key pushes the release commit and tag to the protected main; only this workflow
      # holds it. GitHub's own checkout: the key is not handed to a third-party action.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Next version
        id: version
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
        run: |
          version=$(node scripts/release-version.mjs)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -z "$version" ]; then
            echo "Nothing to release: no feat, fix, perf or breaking commit since the last tag." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Next version: **v$version**." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set the version and build the packages
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e 'const fs = require("fs"); const p = "extension/manifest.json"; const m = JSON.parse(fs.readFileSync(p, "utf8")); m.version = process.argv[1]; fs.writeFileSync(p, JSON.stringify(m, null, 2) + "\n")' "$VERSION"
          ./scripts/package.sh
          npx --yes web-ext@10.8.0 lint --source-dir dist/firefox --warnings-as-errors

      - name: Commit, tag and push to main
        if: steps.version.outputs.version != '' && env.DRY_RUN != 'true'
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension/manifest.json
          git commit -m "release: $TAG"
          git tag -a "$TAG" -m "Refine for GitHub $TAG"
          git push --atomic origin "HEAD:refs/heads/main" "$TAG"

      - name: Publish the GitHub release
        if: steps.version.outputs.version != '' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          fields=(-f tag_name="$tag")
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "$tag^" 2>/dev/null || true)
          [ -n "$previous" ] && fields+=(-f previous_tag_name="$previous")
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${fields[@]}" --jq .body > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag --latest \
            "dist/refine-for-github-$VERSION-chrome.zip" \
            "dist/refine-for-github-$VERSION-firefox.zip"
