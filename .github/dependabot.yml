version: 2

# The extension has no package dependencies; only the workflow actions, pinned by SHA.
# `cooldown` waits a few days before proposing a new release: a compromised package
# is usually found and pulled within that time.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
